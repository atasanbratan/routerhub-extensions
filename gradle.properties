org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# The Kotlin stdlib is part of the platform the RouterHub app hands to extensions at runtime. Every
# module declares it explicitly, so an extension takes it as compileOnly instead of silently
# bundling a second copy.
kotlin.stdlib.default.dependency=false
